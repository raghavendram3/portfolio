  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    
    // Header scroll effect
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 50));

    // Gallery images
    const images = [
      { src: 'images/berlin.jpg', alt: 'Berlin' },
      { src: 'images/paris.jpg', alt: 'Paris' },
      { src: 'images/Lisbon.jpg', alt: 'Lisbon' },
      { src: 'images/italia.jpg', alt: 'Italy' },
      { src: 'images/fkf.jpg', alt: 'Urban scene' },
      { src: 'images/DSC_0069.jpg', alt: 'Landscape' },
      { src: 'images/DSC_0079.jpg', alt: 'Nature' },
      { src: 'images/DSC_0082.jpg', alt: 'Scenic view' },
      { src: 'images/DSC_0084.jpg', alt: 'Landscape' },
      { src: 'images/IMG_20210831_180425.jpg', alt: 'Golden hour' },
      { src: 'images/IMG_20210904_204541.jpg', alt: 'Evening' },
      { src: 'images/IMG_20210904_215804.jpg', alt: 'Night' },
      { src: 'images/WA0001.jpg', alt: 'Street' },
      { src: 'images/WA0005.jpg', alt: 'Urban' },
      { src: 'images/WA0007.jpg', alt: 'City' },
      { src: 'images/WA0008.jpg', alt: 'Street view' }
    ];

    const gallery = document.getElementById('gallery');
    images.forEach(img => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `<img src="${img.src}" alt="${img.alt}" loading="lazy">`;
      item.onclick = () => openLightbox(img.src, img.alt);
      gallery.appendChild(item);
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    
    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }
    
    lightbox.onclick = closeLightbox;
    document.querySelector('.lightbox__close').onclick = closeLightbox;
    document.addEventListener('keydown', e => e.key === 'Escape' && closeLightbox());
  </script>
